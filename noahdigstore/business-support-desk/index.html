<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183b34">
  <title>NOAH DIGITAL STORES | Business Desk</title>
  <style>
    :root{--ink:#172d2a;--muted:#687b75;--paper:#f2f4ef;--white:#fff;--line:#dce3db;--green:#1b6652;--green-soft:#e4f0e9;--orange:#e29a42;--purple:#75669b;--red:#b7524c;--nav:#183b34;--radius:7px;--serif:Georgia,"Times New Roman",serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "Trebuchet MS",Verdana,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e29a4266;outline-offset:1px}.app{min-height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr)}.sidebar{background:var(--nav);color:white;padding:21px 14px;display:flex;flex-direction:column;gap:22px}.brand{border-bottom:1px solid #ffffff24;padding:4px 8px 18px}.brand strong{display:block;font:700 14px var(--serif);letter-spacing:.5px}.brand small{color:#b8c9c1}.nav{display:grid;gap:4px}.nav button{background:transparent;border:0;border-radius:5px;text-align:left;color:#c7d5ce;padding:10px 11px}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.nav button span{display:inline-block;width:25px;color:#edb35f}.side-note{margin-top:auto;color:#adc1b8;font-size:11px;line-height:1.55;padding:7px}.main{min-width:0}.topbar{height:66px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 23px;position:sticky;top:0;z-index:5;gap:12px}.topbar h1{font:400 22px var(--serif);margin:0}.top-actions{display:flex;gap:8px;align-items:center}.content{max-width:1450px;margin:auto;padding:22px 24px 40px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}.page-head h2{font:400 27px/1.1 var(--serif);margin:0}.page-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.primary,.secondary,.danger{border-radius:var(--radius);padding:9px 12px;font-weight:700}.primary{border:0;background:var(--green);color:white}.primary:hover{background:#14533f}.secondary{border:1px solid var(--line);background:white;color:var(--ink)}.danger{border:1px solid #efd0cd;background:#fff;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat,.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}.stat-label{font-size:11px;color:var(--muted)}.stat-value{font:400 24px var(--serif);margin:6px 0 1px}.stat-note{font-size:10px;color:var(--green)}.grid-two{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel-head h3{font:600 16px var(--serif);margin:0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:11px 0}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;background:white;color:var(--ink);min-width:0}.toolbar input{flex:1;min-width:170px;max-width:360px}.field{display:grid;gap:6px;margin-bottom:12px}.field label,.field>span{font-size:11px;font-weight:700;color:#52655e}.field textarea{resize:vertical;min-height:72px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field.full{grid-column:1/-1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius)}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid #e9eee8;font-size:12px}th{position:sticky;top:0;background:#f8faf7;color:#62726b;text-transform:uppercase;letter-spacing:.35px;font-size:10px}tbody tr:last-child td{border-bottom:0}.sub{color:var(--muted);font-size:10px;margin-top:3px}.status{display:inline-block;border-radius:99px;background:#edf0eb;padding:3px 7px;font-size:10px;white-space:nowrap}.status.done,.status.paid{background:var(--green-soft);color:#145c44}.status.alert{background:#fbe9e5;color:#a33f38}.status.active{background:#eeeaf5;color:#66558d}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.row-actions button{padding:5px 7px;font-size:10px}.empty{text-align:center;color:var(--muted);padding:25px}.notice{background:#fff5e7;border:1px solid #f1dfbf;border-radius:var(--radius);padding:11px 13px;color:#735426;font-size:12px;line-height:1.5;margin:0 0 14px}.bars{display:grid;gap:9px}.bar-row{display:grid;grid-template-columns:88px 1fr 54px;gap:8px;align-items:center;font-size:11px}.bar-track{height:8px;background:#edf0eb;border-radius:2px;overflow:hidden}.bar-fill{height:100%;background:var(--green)}.bar-fill.alt{background:var(--purple)}.toast{position:fixed;right:17px;bottom:17px;background:var(--nav);color:white;padding:11px 14px;border-radius:5px;z-index:20;box-shadow:0 8px 28px #172d2a30}.modal{width:min(640px,calc(100vw - 24px));border:0;border-radius:8px;padding:0;box-shadow:0 20px 70px #0004}.modal::backdrop{background:#14251eaa}.modal-body{padding:19px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.modal-head h2{font:400 22px var(--serif);margin:0}.mobile-menu{display:none}.footer-note{font-size:11px;color:var(--muted);margin-top:12px}
    @media(max-width:980px){.app{grid-template-columns:190px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-two{grid-template-columns:1fr}}
    @media(max-width:700px){.app{display:block}.sidebar{display:none;position:fixed;inset:0 auto 0 0;width:258px;z-index:15;box-shadow:0 0 0 100vmax #0006}.sidebar.open{display:flex}.mobile-menu{display:inline-block}.topbar{height:59px;padding:0 12px}.topbar h1{font-size:18px}.content{padding:15px 11px 28px}.page-head{align-items:flex-start;flex-direction:column}.page-head h2{font-size:23px}.stats{gap:7px}.stat{padding:11px}.stat-value{font-size:21px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top-actions .wide-label{display:none}}
    @media print{body{background:white}.sidebar,.topbar,.actions,.toolbar,.row-actions,.no-print{display:none!important}.app{display:block}.content{padding:0;max-width:none}.page{display:block!important}.panel,.stat{break-inside:avoid}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><strong>NOAH DIGITAL STORES</strong><small>Business Desk · OneDrive Excel</small></div>
      <nav class="nav" id="nav">
        <button class="active" data-page="dashboard"><span>▦</span>Overview</button>
        <button data-page="orders"><span>↗</span>Orders</button>
        <button data-page="customers"><span>◎</span>Customers</button>
        <button data-page="payments"><span>＋</span>Payments</button>
        <button data-page="receipts"><span>▤</span>Receipts</button>
        <button data-page="reports"><span>⌁</span>Reports</button>
        <button data-page="settings"><span>⚙</span>Settings & backup</button>
      </nav>
      <div class="side-note">Excel is the shared database after staff sign-in. WhatsApp links prepare a message; staff still press Send.</div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="top-actions"><button class="secondary mobile-menu" id="menu-toggle" aria-label="Open navigation">☰</button><h1 id="page-title">Overview</h1></div><div class="top-actions"><span class="sub" id="excel-state">Excel not connected</span><button class="secondary" id="excel-connect">Connect Excel</button><button class="secondary" id="refresh">↻ <span class="wide-label">Refresh</span></button><button class="primary" id="export-top">Backup</button></div></header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <dialog class="modal" id="modal"><div class="modal-body"><div class="modal-head"><h2 id="modal-title"></h2><button class="secondary" id="modal-close" aria-label="Close">×</button></div><div id="modal-content"></div></div></dialog>
  <div class="toast" id="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="excel-db.js"></script>
  <script>
    (() => {
      'use strict';
      const STORE='noahDigitalStoresDesk_v1';
      const TITLES={dashboard:'Overview',orders:'Orders',customers:'Customers',payments:'Payments',receipts:'Receipts',reports:'Reports',settings:'Settings & backup'};
      const STATUSES=['Mpya','Inatafutiwa','Muuzaji amepatikana','Mteja amearifiwa','Imekamilika','Imeahirishwa'];
      const METHODS=['Cash','M-Pesa','Tigo Pesa','Airtel Money','Bank Transfer','Other'];
      const $=id=>document.getElementById(id);
      const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const money=value=>'TZS '+Number(value||0).toLocaleString('en-US');
      const today=()=>new Date().toISOString().slice(0,10);
      const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now().toString(36)}${Math.random().toString(36).slice(2,10)}`;
      const defaults={settings:{name:'NOAH DIGITAL STORES',phone:'255614128298',location:'Cheyo, Tabora, Tanzania',footer:'Thank you for choosing NOAH DIGITAL STORES.'},requests:[],suppliers:[],transactions:[],payments:[],receipts:[],activity:[]};
      let db=load();let page='dashboard';let search='';let statusFilter='';let dateFilter='';
      function load(){try{const data=JSON.parse(localStorage.getItem(STORE)||'null');if(data&&Array.isArray(data.requests)){return {...defaults,...data,settings:{...defaults.settings,...data.settings},payments:Array.isArray(data.payments)?data.payments:[],receipts:Array.isArray(data.receipts)?data.receipts:[],activity:Array.isArray(data.activity)?data.activity:[]}}}catch{}return structuredClone(defaults)}
        function save(){try{localStorage.setItem(STORE,JSON.stringify(db));render();window.noahExcelSave?.(db);return true}catch{toast('Storage is full or unavailable. Export a backup and free browser space.');return false}}
      function toast(message){const el=$('toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3200)}
      function log(action,order,details=''){db.activity.push({id:uid(),time:new Date().toISOString(),action,order:order?.no||'',details});db.activity=db.activity.slice(-500)}
      function paymentTotals(order){const related=db.payments.filter(payment=>payment.orderId===(order.id||order.orderId));const paid=related.length?related.reduce((sum,payment)=>sum+Number(payment.amount||0),0):Number(order.amountPaid||0);const total=Number(order.totalAmount??order.estimatedTotal??order.orderSubtotal??order.goodsSubtotal??0);return {total,paid,balance:Math.max(0,total-paid),status:paid>=total&&total>0?'Fully Paid':paid>0?'Partially Paid':'Unpaid'}}
      function pageHead(title,subtitle,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${subtitle}</p></div><div class="actions">${actions}</div></div>`}
      function stat(label,value,note=''){return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
      function orders(){const q=search.toLowerCase();return [...db.requests].filter(order=>(!statusFilter||order.status===statusFilter)&&(!dateFilter||String(order.submittedAt||order.created||'').slice(0,10)===dateFilter)&&[order.no,order.orderReference,order.customer,order.customerName,order.phone,order.product,order.productSummary].join(' ').toLowerCase().includes(q)).sort((a,b)=>String(b.submittedAt||b.created||'').localeCompare(String(a.submittedAt||a.created||'')))}
      function table(rows){if(!rows.length)return '<div class="empty">No orders found.</div>';return `<div class="table-wrap"><table><thead><tr><th>Reference / date</th><th>Customer</th><th>Products</th><th>Total / due</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(order=>{const totals=paymentTotals(order);const ref=order.orderReference||order.no||'—';return `<tr><td><strong>${esc(ref)}</strong><div class="sub">${esc(order.submittedAt||order.created||'')}</div></td><td><strong>${esc(order.customer||order.customerName||'')}</strong><div class="sub">${esc(order.phone||'')}</div></td><td>${esc(order.product||order.productSummary||'')}</td><td>${money(totals.total)}<div class="sub">Due ${money(totals.balance)}</div></td><td><span class="status ${totals.status==='Fully Paid'?'paid':totals.status==='Partially Paid'?'active':''}">${totals.status}</span></td><td><select aria-label="Order status" onchange="window.ndsStatus('${esc(order.id||order.orderId)}',this.value)">${STATUSES.map(value=>`<option ${value===(order.status||'Mpya')?'selected':''}>${esc(value)}</option>`).join('')}</select><div class="sub">${esc(order.status||'Mpya')}</div></td><td><div class="row-actions"><button class="secondary" onclick="window.ndsDetails('${esc(order.id||order.orderId)}')">Details</button><button class="secondary" onclick="window.ndsPayment('${esc(order.id||order.orderId)}')">Payment</button><button class="secondary" onclick="window.ndsReceipt('${esc(order.id||order.orderId)}')">Receipt</button><button class="secondary" onclick="window.ndsWhatsApp('${esc(order.id||order.orderId)}')">WhatsApp</button></div></td></tr>`}).join('')}</tbody></table></div>`}
      function chartRows(rows,labelKey,valueKey,alt=false){const max=Math.max(1,...rows.map(row=>Number(row[valueKey]||0)));return `<div class="bars">${rows.map(row=>`<div class="bar-row"><span>${esc(row[labelKey])}</span><div class="bar-track"><div class="bar-fill ${alt?'alt':''}" style="width:${Number(row[valueKey]||0)/max*100}%"></div></div><span class="sub">${Number(row[valueKey]||0).toLocaleString('en-US')}</span></div>`).join('')}</div>`}
      function dashboard(){const all=db.requests;const total=all.reduce((sum,order)=>sum+paymentTotals(order).total,0);const outstanding=all.reduce((sum,order)=>sum+paymentTotals(order).balance,0);const recent=[...all].sort((a,b)=>String(b.submittedAt||b.created).localeCompare(String(a.submittedAt||a.created))).slice(0,6);const dates=Array.from({length:7},(_,i)=>{const date=new Date();date.setDate(date.getDate()-(6-i));const key=date.toISOString().slice(0,10);return {day:new Date(key+'T12:00:00').toLocaleDateString('en',{weekday:'short'}),count:all.filter(order=>String(order.submittedAt||order.created).slice(0,10)===key).length}});const products=new Map();all.forEach(order=>(order.lineItems||[]).forEach(item=>products.set(item.name,(products.get(item.name)||0)+Number(item.quantity||0))));const top=[...products.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([name,count])=>({name,count}));return `${pageHead('Business overview','Orders and payments from the connected OneDrive Excel workbook.')}
        <div class="notice">OneDrive Excel is the shared database after staff sign-in. The browser keeps a pending cache for reconnects. Public orders from other devices must be entered here by staff; WhatsApp remains click-to-chat and requires staff to press Send.</div>
        <div class="stats">${stat('Total orders',all.length,'Saved on this browser')}${stat('New orders',all.filter(order=>order.status==='Mpya'||order.status==='New Order').length,'Awaiting review')}${stat('Completed',all.filter(order=>order.status==='Imekamilika'||order.status==='Completed').length,'Marked complete')}${stat('Total order value',money(total),'Value recorded')}${stat('Outstanding',money(outstanding),'Based on recorded payments')}${stat('Customers',customerRows().length,'Unique phone numbers')}${stat('Processing',all.filter(order=>['Inatafutiwa','Processing'].includes(order.status)).length,'In progress')}${stat('Cancelled',all.filter(order=>['Imeahirishwa','Cancelled'].includes(order.status)).length,'Cancelled / on hold')}</div>
        <div class="grid-two"><section class="panel"><div class="panel-head"><h3>Daily orders · 7 days</h3></div>${chartRows(dates,'day','count')}</section><section class="panel"><div class="panel-head"><h3>Most ordered products</h3></div>${top.length?chartRows(top,'name','count',true):'<div class="empty">Product details appear here for storefront bag orders.</div>'}</section></div>
        <section class="panel" style="margin-top:12px"><div class="panel-head"><h3>Latest orders</h3><button class="secondary" onclick="window.ndsGo('orders')">View orders</button></div>${table(recent)}</section>`}
      function ordersPage(){const options=['<option value="">All statuses</option>',...STATUSES.map(value=>`<option ${statusFilter===value?'selected':''}>${esc(value)}</option>`)].join('');return `${pageHead('Orders','Website bag submissions are added automatically. Use manual entry only for orders received outside the website.','<button class="primary" onclick="window.ndsAddOrder()">＋ Add off-site WhatsApp order</button>')}<div class="toolbar"><input id="search-orders" placeholder="Reference, customer, phone or product" value="${esc(search)}"><select id="filter-status">${options}</select><input id="filter-date" type="date" aria-label="Filter by order date" value="${esc(dateFilter)}"><button class="secondary" onclick="window.ndsExport('orders')">Export CSV</button></div>${table(orders())}`}
      function customerRows(){const map=new Map();db.requests.forEach(order=>{const key=(order.phone||order.customer||order.customerName||'').replace(/\D/g,'')||String(order.customer||order.customerName||'').toLowerCase();const item=map.get(key)||{name:order.customer||order.customerName||'Unknown',phone:order.phone||'',orders:[],value:0,last:''};item.orders.push(order);item.value+=paymentTotals(order).total;item.last=String(order.submittedAt||order.created||'')>item.last?String(order.submittedAt||order.created||''):item.last;map.set(key,item)});return [...map.values()]}
      function customersPage(){const q=search.toLowerCase();const rows=customerRows().filter(row=>[row.name,row.phone].join(' ').toLowerCase().includes(q));return `${pageHead('Customers','Customer profiles are derived from received orders.')}<div class="toolbar"><input id="search-customers" placeholder="Search customer or phone" value="${esc(search)}"></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>WhatsApp</th><th>Orders</th><th>Total order value</th><th>Latest order</th></tr></thead><tbody>${rows.length?rows.map(row=>`<tr><td><strong>${esc(row.name)}</strong></td><td>${esc(row.phone||'—')}</td><td>${row.orders.length}</td><td>${money(row.value)}</td><td>${esc(row.last||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No customers found.</td></tr>'}</tbody></table></div>`}
      function paymentsPage(){const payments=[...db.payments].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `${pageHead('Payments','Payment records are independent of receipt generation.','<button class="primary" onclick="window.ndsPayment()">＋ Record payment</button>')}<div class="table-wrap"><table><thead><tr><th>Date</th><th>Order</th><th>Customer</th><th>Amount</th><th>Method</th><th>Transaction</th><th>Notes</th></tr></thead><tbody>${payments.length?payments.map(payment=>{const order=db.requests.find(row=>(row.id||row.orderId)===payment.orderId);return `<tr><td>${esc(payment.date)}</td><td>${esc(order?.orderReference||order?.no||'Deleted order')}</td><td>${esc(order?.customer||order?.customerName||'')}</td><td>${money(payment.amount)}</td><td>${esc(payment.method)}</td><td>${esc(payment.reference||'—')}</td><td>${esc(payment.notes||'—')}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No payments recorded.</td></tr>'}</tbody></table></div>`}
      function receiptsPage(){return `${pageHead('Receipts','Print or save a receipt as PDF from your browser.')}<div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Order</th><th>Date</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.receipts.length?[...db.receipts].reverse().map(receipt=>`<tr><td><strong>${esc(receipt.number)}</strong></td><td>${esc(receipt.orderReference)}</td><td>${esc(receipt.date)}</td><td>${money(receipt.total)}</td><td>${money(receipt.paid)}</td><td>${money(receipt.balance)}</td><td>${esc(receipt.paymentStatus)}</td><td><button class="secondary" onclick="window.ndsPrintReceipt('${esc(receipt.id)}')">Open / Print</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No receipts generated yet.</td></tr>'}</tbody></table></div><p class="footer-note">A local receipt cannot be hosted as a customer-accessible URL. Use WhatsApp to share receipt details, then attach the downloaded PDF manually if needed.</p>`}
      function reportsPage(){const now=new Date(),date=now.toISOString().slice(0,10),month=date.slice(0,7),year=date.slice(0,4);const all=db.requests;const periods=[['Today',all.filter(row=>String(row.submittedAt||row.created).slice(0,10)===date)],['This month',all.filter(row=>String(row.submittedAt||row.created).slice(0,7)===month)],['This year',all.filter(row=>String(row.submittedAt||row.created).slice(0,4)===year)]];const monthly=new Map();all.forEach(order=>{const key=String(order.submittedAt||order.created||'').slice(0,7);if(!key)return;const value=monthly.get(key)||{orders:0,sales:0,paid:0,due:0};const totals=paymentTotals(order);value.orders++;value.sales+=totals.total;value.paid+=totals.paid;value.due+=totals.balance;monthly.set(key,value)});return `${pageHead('Reports','Sales are calculated from submitted order totals; payments are recorded separately.','<button class="secondary" onclick="window.print()">Print / Save PDF</button><button class="secondary" onclick="window.ndsExport(\'orders\')">Export CSV</button>')}<div class="stats">${periods.map(([label,rows])=>stat(label,rows.length+' orders',money(rows.reduce((sum,row)=>sum+paymentTotals(row).total,0))+' order value')).join('')}${stat('Payments recorded',money(db.payments.reduce((sum,payment)=>sum+Number(payment.amount||0),0)),'Recorded in this browser')}${stat('Outstanding',money(all.reduce((sum,row)=>sum+paymentTotals(row).balance,0)),'Current balance')}</div><section class="panel"><div class="panel-head"><h3>Monthly sales and payments</h3></div><div class="table-wrap"><table><thead><tr><th>Month</th><th>Orders</th><th>Order value</th><th>Paid</th><th>Outstanding</th></tr></thead><tbody>${monthly.size?[...monthly.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([key,row])=>`<tr><td>${esc(key)}</td><td>${row.orders}</td><td>${money(row.sales)}</td><td>${money(row.paid)}</td><td>${money(row.due)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No report data yet.</td></tr>'}</tbody></table></div></section>`}
      function settingsPage(){const config=window.noahExcelConfig?.()||{};return `${pageHead('Settings & Excel connection','Connect this staff desk to a workbook in your OneDrive.')}<div class="grid-two"><section class="panel"><div class="panel-head"><h3>Receipt details</h3></div><form id="settings-form"><label class="field">Business name<input name="name" value="${esc(db.settings.name||'NOAH DIGITAL STORES')}" required></label><label class="field">WhatsApp number<input name="phone" value="${esc(db.settings.phone||'255614128298')}"></label><label class="field">Location<input name="location" value="${esc(db.settings.location||'Cheyo, Tabora, Tanzania')}"></label><label class="field">Receipt footer<input name="footer" value="${esc(db.settings.footer||'Thank you for choosing NOAH DIGITAL STORES.')}"></label><button class="primary">Save details</button></form></section><section class="panel"><div class="panel-head"><h3>Microsoft Excel in OneDrive</h3></div><p class="sub">Connect using a Microsoft work account. The workbook is stored in your OneDrive; this desk uses Microsoft sign-in and does not ask for your password.</p><form id="excel-config-form"><label class="field">Microsoft Entra application (client) ID<input name="clientId" value="${esc(config.clientId||'')}" required></label><label class="field">Tenant ID or <code>common</code><input name="tenantId" value="${esc(config.tenantId||'organizations')}" required></label><button class="primary">Save connection details and sign in</button></form><p class="footer-note">Register a single-page application with Microsoft Entra ID. Add this page's URL as a redirect URI and grant delegated <code>User.Read</code> and <code>Files.ReadWrite</code> permissions. Do not enter a client secret.</p></section></div><section class="panel" style="margin-top:12px"><div class="panel-head"><h3>Data and backup</h3></div><p class="sub">The OneDrive workbook is the shared database after connection. WhatsApp orders from other devices must be entered here by staff; a public static checkout cannot write to a private workbook without a backend.</p><div class="actions"><button class="primary" id="download-backup">Download JSON backup</button><label class="secondary" for="import-backup">Restore backup</label><input id="import-backup" type="file" accept="application/json,.json" hidden><button class="secondary" onclick="window.ndsExport('orders')">Download orders CSV</button></div></section><section class="panel" style="margin-top:12px"><div class="panel-head"><h3>Recent activity</h3></div>${activityTable()}</section>`}
      function activityTable(){const rows=[...db.activity].reverse().slice(0,30);return `<div class="table-wrap"><table><thead><tr><th>Time</th><th>Action</th><th>Order</th><th>Details</th></tr></thead><tbody>${rows.length?rows.map(row=>`<tr><td>${esc(row.time)}</td><td>${esc(row.action)}</td><td>${esc(row.order)}</td><td>${esc(row.details)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No activity recorded.</td></tr>'}</tbody></table></div>`}
      const renderers={dashboard,orders:ordersPage,customers:customersPage,payments:paymentsPage,receipts:receiptsPage,reports:reportsPage,settings:settingsPage};
      function render(){ $('page-title').textContent=TITLES[page];$('content').innerHTML=renderers[page]();document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',button.dataset.page===page));bindPage() }
        function bindPage(){const orderSearch=$('search-orders');if(orderSearch)orderSearch.oninput=()=>{search=orderSearch.value;render()};const customerSearch=$('search-customers');if(customerSearch)customerSearch.oninput=()=>{search=customerSearch.value;render()};const filter=$('filter-status');if(filter)filter.onchange=()=>{statusFilter=filter.value;render()};const date=$('filter-date');if(date)date.onchange=()=>{dateFilter=date.value;render()};const settings=$('settings-form');if(settings)settings.onsubmit=event=>{event.preventDefault();db.settings={...db.settings,...Object.fromEntries(new FormData(settings))};log('Settings updated',null,'Receipt details');save();toast('Receipt details saved.')};const excelConfig=$('excel-config-form');if(excelConfig)excelConfig.onsubmit=event=>{event.preventDefault();window.noahExcelConnect(Object.fromEntries(new FormData(excelConfig)))};const backup=$('download-backup');if(backup)backup.onclick=exportBackup;const input=$('import-backup');if(input)input.onchange=importBackup}
      function openModal(title,html){$('modal-title').textContent=title;$('modal-content').innerHTML=html;$('modal').showModal()}
      function findOrder(id){return db.requests.find(order=>(order.id||order.orderId)===id)}
      window.ndsGo=next=>{page=next;search='';statusFilter='';dateFilter='';$('sidebar').classList.remove('open');render()};
      window.ndsAddOrder=()=>{openModal('Add order received through WhatsApp',`<form id="add-order-form"><div class="form-grid"><label class="field"><span>Customer name *</span><input name="customer" required></label><label class="field"><span>WhatsApp number *</span><input name="phone" required></label><label class="field full"><span>Products / request *</span><textarea name="product" required></textarea></label><label class="field"><span>Order total (TZS)</span><input name="totalAmount" type="number" min="0" value="0"></label><label class="field"><span>Source reference</span><input name="originalReference" placeholder="WhatsApp message reference"></label><label class="field full"><span>Notes</span><textarea name="notes"></textarea></label></div><button class="primary">Save to Excel database</button></form>`);$('add-order-form').onsubmit=event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.currentTarget));const id=uid(),reference=`NDS-${new Date().getFullYear()}-${id.replace(/[^a-z\d]/gi,'').slice(-12).toUpperCase()}`;const order={id,orderId:id,no:reference,orderReference:reference,submittedAt:new Date().toISOString(),created:today(),updated:today(),customer:values.customer.trim(),phone:values.phone.trim(),product:values.product.trim(),productSummary:values.product.trim(),category:'',totalAmount:Number(values.totalAmount||0),orderSubtotal:Number(values.totalAmount||0),goodsSubtotal:Number(values.totalAmount||0),fee:0,amountPaid:0,outstandingBalance:Number(values.totalAmount||0),paymentStatus:'Unpaid',feeStatus:'Haijalipwa',status:'Mpya',source:'WhatsApp',originalReference:values.originalReference.trim(),notes:values.notes.trim(),lineItems:[]};db.requests.push(order);log('WhatsApp order added',order);$('modal').close();save();toast('Order saved. Connect Excel to sync it to OneDrive.') }};
      window.ndsDetails=id=>{const order=findOrder(id);if(!order)return;const totals=paymentTotals(order);openModal(order.orderReference||order.no,`<p><b>${esc(order.customer||order.customerName)}</b><br>${esc(order.phone||'')}${order.email?' · '+esc(order.email):''}</p><p>${esc(order.product||order.productSummary||'')}</p>${order.lineItems?.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Quantity</th><th>Unit price</th><th>Subtotal</th></tr></thead><tbody>${order.lineItems.map(item=>`<tr><td>${esc(item.name)}<div class="sub">${esc(item.description||'')}</div></td><td>${Number(item.quantity||0)}</td><td>${money(item.unitPrice)}</td><td>${money(item.subtotal)}</td></tr>`).join('')}</tbody></table></div>`:''}<p style="margin-top:12px">Total ${money(totals.total)} · Paid ${money(totals.paid)} · Due ${money(totals.balance)}</p><p class="sub">Submitted ${esc(order.submittedAt||order.created||'')} · Source: ${esc(order.source||'Website')}</p><p>${esc(order.details||'')}</p><p>${esc(order.notes||'')}</p>`)};
      window.ndsStatus=(id,next)=>{const order=findOrder(id);if(!order)return;const previous=order.status||'Mpya';order.status=next;order.updated=today();log('Status changed',order,`${previous} -> ${next}`);save()};
      window.ndsWhatsApp=id=>{const order=findOrder(id);if(!order||!order.phone){toast('No customer WhatsApp number was recorded.');return}const totals=paymentTotals(order);let phone=order.phone.replace(/\D/g,'');if(phone.startsWith('0'))phone='255'+phone.slice(1);const text=`Hello ${order.customer||order.customerName},\n\nThank you for your order with NOAH DIGITAL STORES.\nOrder reference: ${order.orderReference||order.no}\nReceipt: ${order.receiptNumber||'Generate a receipt in the Business Desk'}\nTotal: ${money(totals.total)}\nPaid: ${money(totals.paid)}\nOutstanding: ${money(totals.balance)}\n\nThank you for choosing NOAH DIGITAL STORES.`;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank','noopener')};
      window.ndsPayment=id=>{const orderOptions=db.requests.map(order=>`<option value="${esc(order.id||order.orderId)}" ${order.id===id||order.orderId===id?'selected':''}>${esc(order.orderReference||order.no)} · ${esc(order.customer||order.customerName)}</option>`).join('');if(!orderOptions){toast('There are no orders to attach a payment to.');return}openModal('Record payment',`<form id="payment-form"><label class="field"><span>Order</span><select name="orderId" required>${orderOptions}</select></label><div class="form-grid"><label class="field"><span>Amount (TZS)</span><input name="amount" type="number" min="1" required></label><label class="field"><span>Date</span><input name="date" type="date" value="${today()}" required></label><label class="field"><span>Method</span><select name="method">${METHODS.map(method=>`<option>${method}</option>`).join('')}</select></label><label class="field"><span>Transaction reference</span><input name="reference"></label><label class="field full"><span>Notes</span><textarea name="notes"></textarea></label></div><button class="primary">Save payment</button></form>`);$('payment-form').onsubmit=event=>{event.preventDefault();const payment=Object.fromEntries(new FormData(event.currentTarget));payment.id=uid();payment.amount=Number(payment.amount);const order=findOrder(payment.orderId);if(!order)return;const balance=paymentTotals(order).balance;if(payment.amount>balance){toast('Amount exceeds the outstanding balance.');return}db.payments.push(payment);const totals=paymentTotals(order);order.amountPaid=totals.paid;order.outstandingBalance=totals.balance;order.paymentStatus=totals.status;log('Payment recorded',order,`${money(payment.amount)} · ${payment.method}`);$('modal').close();save();toast('Payment recorded; balance updated.') }};
      window.ndsReceipt=id=>{const order=findOrder(id);if(!order)return;const totals=paymentTotals(order);const receiptId=uid();const receipt={id:receiptId,number:`NDS-R-${new Date().getFullYear()}-${receiptId.replace(/[^a-z\d]/gi,'').slice(-10).toUpperCase()}`,orderId:order.id||order.orderId,orderReference:order.orderReference||order.no,date:today(),total:totals.total,paid:totals.paid,balance:totals.balance,paymentStatus:totals.status};db.receipts.push(receipt);log('Receipt generated',order,receipt.number);save();printReceipt(receipt.id);window.ndsWhatsApp(id)};
      function printReceipt(id){const receipt=db.receipts.find(row=>row.id===id);if(!receipt)return;const order=findOrder(receipt.orderId);if(!order)return;const items=order.lineItems||[];const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(receipt.number)}</title><style>body{font:14px/1.5 Arial,sans-serif;color:#172d2a;max-width:760px;margin:40px auto;padding:24px}header{border-bottom:3px solid #1b6652;padding-bottom:14px;display:flex;justify-content:space-between;gap:20px}h1{font:28px Georgia;margin:0 0 6px}h2{font:24px Georgia;margin:22px 0}small{color:#687b75}table{width:100%;border-collapse:collapse;margin-top:22px}th,td{text-align:left;border-bottom:1px solid #dce3db;padding:10px 6px}.num{text-align:right}.totals{margin:18px 0 0 auto;max-width:300px}.totals div{display:flex;justify-content:space-between;padding:5px}.grand{border-top:1px solid #dce3db;font-weight:bold;font-size:17px}.thanks{text-align:center;color:#1b6652;margin:30px 0;font:italic 17px Georgia}.tools{text-align:right;margin-bottom:16px}@media print{.tools{display:none}body{margin:0;padding:16mm}}</style></head><body><div class="tools"><button onclick="window.print()">Print / Save PDF</button></div><header><div><h1>${esc(db.settings.name)}</h1><small>${esc(db.settings.location)}</small></div><div><small>${esc(db.settings.phone)}</small></div></header><h2>Receipt</h2><p><b>Receipt number:</b> ${esc(receipt.number)}<br><b>Order reference:</b> ${esc(receipt.orderReference)}<br><b>Date:</b> ${esc(receipt.date)}<br><b>Customer:</b> ${esc(order.customer||order.customerName)}<br><b>WhatsApp:</b> ${esc(order.phone||'')}</p><table><thead><tr><th>Product</th><th>Qty</th><th class="num">Unit price</th><th class="num">Subtotal</th></tr></thead><tbody>${items.length?items.map(item=>`<tr><td>${esc(item.name)}</td><td>${Number(item.quantity||0)}</td><td class="num">${money(item.unitPrice)}</td><td class="num">${money(item.subtotal)}</td></tr>`).join(''):`<tr><td>${esc(order.product||order.productSummary||'Order')}</td><td>—</td><td class="num">—</td><td class="num">${money(receipt.total)}</td></tr>`}</tbody></table><div class="totals"><div><span>Goods subtotal</span><b>${money(order.goodsSubtotal||order.orderSubtotal||receipt.total)}</b></div><div><span>Service fee</span><b>${money(order.fee||0)}</b></div><div class="grand"><span>Total</span><b>${money(receipt.total)}</b></div><div><span>Amount paid</span><b>${money(receipt.paid)}</b></div><div><span>Outstanding balance</span><b>${money(receipt.balance)}</b></div><div><span>Payment status</span><b>${esc(receipt.paymentStatus)}</b></div></div><p class="thanks">${esc(db.settings.footer)}</p><small>This receipt reflects the payments recorded in this browser when generated.</small></body></html>`;const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}
      window.ndsPrintReceipt=printReceipt;
      window.ndsExport=kind=>{const rows=kind==='payments'?db.payments:db.requests;const headers=kind==='payments'?['date','orderId','amount','method','reference','notes']:['orderReference','no','submittedAt','created','customer','phone','product','category','totalAmount','amountPaid','outstandingBalance','status'];const csv=[headers.join(','),...rows.map(row=>headers.map(key=>'"'+String(row[key]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');download(`noah-${kind}-${today()}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8')};
      function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
      function exportBackup(){download(`noah-desk-backup-${today()}.json`,JSON.stringify(db,null,2),'application/json')}
      async function importBackup(event){const file=event.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.requests))throw new Error('Invalid backup');if(confirm('Replace this browser\'s current desk data with this backup?')){db={...defaults,...data,settings:{...defaults.settings,...data.settings},payments:Array.isArray(data.payments)?data.payments:[],receipts:Array.isArray(data.receipts)?data.receipts:[],activity:Array.isArray(data.activity)?data.activity:[]};save();toast('Backup restored.')}}catch{toast('That file is not a valid Noah Desk backup.')}event.target.value=''}
      $('nav').onclick=event=>{const button=event.target.closest('[data-page]');if(button)window.ndsGo(button.dataset.page)};
      $('menu-toggle').onclick=()=>$('sidebar').classList.toggle('open');$('modal-close').onclick=()=>$('modal').close();$('refresh').onclick=()=>{if(window.noahExcelIsConnected?.())window.noahExcelRefresh();else{db=load();render();toast('Browser records refreshed.')}};$('excel-connect').onclick=()=>window.noahExcelConnect?.();$('export-top').onclick=exportBackup;
      window.addEventListener('storage',event=>{if(event.key===STORE){db=load();render();window.noahExcelSave?.(db)}});
      window.noahDeskData=()=>db;
      window.addEventListener('noah-excel-data',event=>{if(!event.detail)return;db={...defaults,...event.detail,settings:{...defaults.settings,...event.detail.settings}};localStorage.setItem(STORE,JSON.stringify(db));render()});
      render();
    })();
  </script>
